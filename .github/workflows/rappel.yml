# Rappel mensurations : notification ntfy le jour choisi dans l'appli (voir .github/scripts/rappel.js).
# Tourne chaque heure de 4 h à 20 h UTC (6 h à 21 h à Paris selon la saison).
name: Rappel mensurations
on:
  schedule:
    - cron: '7 4-20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: rappel
jobs:
  rappel:
    # Pas sur le dépôt modèle lui-même : seulement dans les dépôts créés à partir de lui.
    if: github.repository != 'slt-debug/muscu-data-template'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/rappel.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Mémoriser l'envoi du jour
        run: |
          if [ -n "$(git status --porcelain notify-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add notify-state.json
            git commit -q -m "rappel mensurations envoyé"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
